# golangci-lint v2 設定 (cli/cli や prometheus なども v2 形式の .golangci.yml を採用)
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # http.Response.Body の Close 漏れ
    - errorlint     # %w / errors.Is / errors.As の誤用
    - gocritic      # バグ・スタイル・性能の総合チェック
    - misspell      # 英単語のスペルミス
    - revive        # golint の後継 (命名・コメントなど)
    - copyloopvar   # Go 1.22 以降不要になったループ変数コピーの検出
    - nilerr        # err != nil なのに nil を返している箇所
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling # fmt.Fprintf 等の戻り値無視は許容

formatters:
  enable:
    - gofmt
    - goimports
